version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5201:5201"
    volumes:
      - ./backend:/app
      - ./auto-poster:/app/auto-poster
    env_file:
      - ./backend/.env
    environment:
      - AP_BACKEND=/app/auto-poster/backend
    command: uvicorn main:app --host 0.0.0.0 --port 5201 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5200:5200"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:5201
