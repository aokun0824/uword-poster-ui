server {
    listen 80;
    server_name uword.kingjungobot.cloud;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name uword.kingjungobot.cloud;

    ssl_certificate /etc/letsencrypt/live/uword.kingjungobot.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uword.kingjungobot.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # フロントエンド静的ファイル
    root /var/www/uword;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # バックエンド API プロキシ（FastAPI 側が /api/ プレフィックス込みで定義されているため rewrite なし）
    location /api/ {
        proxy_pass http://127.0.0.1:5201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ヘルスチェック
    location /health {
        proxy_pass http://127.0.0.1:5201/health;
    }
}
